name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check .

  test:
    name: Tests (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            functions/requirements.txt

      # The Firestore/Storage emulators run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install -q -r requirements-dev.txt
          npm ci --no-fund --no-audit

      # Unit, handler, integration, property and characterisation tests against the emulators
      # (demo-athlethium project only), coverage gates, then the security-rule tests.
      - name: Run test suite
        run: ./scripts/test.sh

      - name: Golden plans report is up to date
        run: functions/venv/bin/python scripts/plan_report.py --check

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo '## Backend coverage'
              echo '```'
              functions/venv/bin/python -m coverage report --skip-covered --sort=cover
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
